[package]
name = "retro-mp3-yt-music"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
zbus = "5"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
